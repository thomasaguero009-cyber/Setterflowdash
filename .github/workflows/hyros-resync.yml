name: Hyros resync (hoy + 2 días atrás)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Mismo grupo que hyros-resync-mes.yml a propósito: los dos comparten la
# MISMA cuenta de servicio (y su misma cuota de lecturas/min de Sheets
# API) — sin esto, si cron-job.org dispara los dos casi al mismo tiempo (o
# una corrida tarda más de la cuenta por estar reintentando), terminaban
# compitiendo por la cuota y fallando en cadena. cancel-in-progress:false
# hace que se ENCOLEN en vez de pisarse — nunca corren dos al mismo tiempo.
concurrency:
  group: hyros-sync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --omit=dev
      - run: node scripts/run-resync.js
        env:
          HYROS_API_KEY: ${{ secrets.HYROS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
